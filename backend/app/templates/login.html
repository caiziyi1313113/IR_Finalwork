<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - Nankai University Search</title>
    <link rel="icon" type="image/webp" href="{{ favicon_url | default('/favicon.ico', true) }}">
    <link rel="stylesheet" href="/static/styles.css?v=20260616-layout-wide-v6">
</head>
<body
    class="app-shell login-page"
    style="--login-bg-image: url('{{ (hero_images | default([], true) | first) or '' }}');"
>
    <div class="login-background" aria-hidden="true"></div>
    <div class="ambient-layer" aria-hidden="true">
        <div class="ambient-glow ambient-glow-a"></div>
        <div class="ambient-glow ambient-glow-b"></div>
    </div>

    <header class="topbar">
        <a href="/" class="brand bubble-target">
            <span class="brand-mark">NKU</span>
            <span class="brand-text">
                <strong>Nankai University Search</strong>
                <small>南开大学信息检索平台</small>
            </span>
        </a>
        <div class="top-actions">
            <a href="/" class="ghost-button bubble-target">返回首页</a>
        </div>
    </header>

    <main class="auth-shell auth-shell-landing">
        <section class="auth-stage-landing">
            <section class="auth-copy-panel">
                <p class="eyebrow">Nankai University Search</p>
                <h1>
                    <span class="title-line">南开大学</span>
                    <span class="title-line">信息检索平台</span>
                </h1>
                <p class="sublead">
                    聚合校园网站、通知公告、培养方案、教师主页与附件文档，提供统一检索入口与个性化访问体验。
                </p>
            </section>

            <section class="auth-card auth-side-card-landing">
                <div class="auth-intro">
                    <p class="eyebrow">Personalized Search Entry</p>
                    <h2 class="auth-side-title">登录 / 注册</h2>
                    <p class="sublead">
                        默认先登录。如果账号不存在，再切换到注册并填写用户画像。注册阶段会同步完成画像刻画。
                    </p>
                </div>

                <div id="auth-mode-switch" class="segmented-control auth-mode-switch">
                    <div class="segment-indicator"></div>
                    <button type="button" class="segment-button is-active bubble-target" data-auth-tab="login">登录</button>
                    <button type="button" class="segment-button bubble-target" data-auth-tab="register">注册</button>
                </div>

                <section id="auth-view-login" class="auth-view is-active">
                    <div class="auth-panel">
                        <h2>登录</h2>
                        <p class="auth-note">已有账号直接登录。旧账号如果还没有画像，登录后仍会进入画像补充页。</p>
                        <form id="login-form" class="auth-form">
                            <label class="field">
                                <span>用户名</span>
                                <input id="login-username" type="text" required>
                            </label>

                            <label class="field">
                                <span>密码</span>
                                <input id="login-password" type="password" required>
                            </label>

                            <button type="submit" class="solid-button bubble-target">登录</button>
                        </form>
                        <p id="login-status" class="status-text"></p>
                        <button type="button" class="auth-inline-link bubble-target" data-auth-tab="register">
                            没有账号？去注册
                        </button>
                    </div>
                </section>

                <section id="auth-view-register" class="auth-view">
                    <div class="auth-panel">
                        <h2>注册</h2>
                        <p class="auth-note">创建账号时同步填写画像，注册完成后可直接进入搜索。</p>
                        <form id="register-form" class="auth-form">
                            <label class="field">
                                <span>用户名</span>
                                <input id="register-username" type="text" required>
                            </label>

                            <label class="field">
                                <span>密码</span>
                                <input id="register-password" type="password" required>
                            </label>

                            <label class="field">
                                <span>身份</span>
                                <select id="register-identity">
                                    <option value="本科生">本科生</option>
                                    <option value="研究生">研究生</option>
                                    <option value="教师">教师</option>
                                    <option value="访客">访客</option>
                                </select>
                            </label>

                            <label class="field">
                                <span>院系 / 站点</span>
                                <select id="register-college">
                                    <option value="">请选择</option>
                                    <option value="南开大学">南开大学</option>
                                    <option value="南开大学新闻网">南开大学新闻网</option>
                                    <option value="教务处">教务处</option>
                                    <option value="本科招生网">本科招生网</option>
                                    <option value="研究生招生网">研究生招生网</option>
                                    <option value="研究生院">研究生院</option>
                                    <option value="计算机学院">计算机学院</option>
                                    <option value="网络与空间安全学院">网络与空间安全学院</option>
                                    <option value="人工智能学院">人工智能学院</option>
                                    <option value="环境学院">环境学院</option>
                                    <option value="商学院">商学院</option>
                                    <option value="经济学院">经济学院</option>
                                    <option value="金融学院">金融学院</option>
                                    <option value="化学学院">化学学院</option>
                                    <option value="医学院">医学院</option>
                                    <option value="物理科学学院">物理科学学院</option>
                                    <option value="数学科学学院">数学科学学院</option>
                                    <option value="马克思主义学院">马克思主义学院</option>
                                    <option value="周恩来政府管理学院">周恩来政府管理学院</option>
                                    <option value="社会学院">社会学院</option>
                                    <option value="电子信息与光学工程学院">电子信息与光学工程学院</option>
                                    <option value="生命科学学院">生命科学学院</option>
                                    <option value="外国语学院">外国语学院</option>
                                </select>
                            </label>

                            <label class="field">
                                <span>专业</span>
                                <input id="register-major" type="text" placeholder="例如：计算机科学与技术">
                            </label>

                            <div class="field">
                                <span>兴趣标签</span>
                                <div class="tag-selector">
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="通知公告">通知公告</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="培养方案">培养方案</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="课程信息">课程信息</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="教师主页">教师主页</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="科研项目">科研项目</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="招生信息">招生信息</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="夏令营推免">夏令营推免</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="学术讲座">学术讲座</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="活动资讯">活动资讯</button>
                                    <button type="button" class="tag-toggle bubble-target" data-interest-tag="附件文档">附件文档</button>
                                </div>
                            </div>

                            <label class="field">
                                <span>检索需求补充说明</span>
                                <textarea id="register-search-need-text" placeholder="例如：更关注课程安排、培养方案、最新通知和导师主页。"></textarea>
                            </label>

                            <button type="submit" class="solid-button bubble-target">创建账号并保存画像</button>
                        </form>
                        <p id="register-status" class="status-text"></p>
                        <button type="button" class="auth-inline-link bubble-target" data-auth-tab="login">
                            已有账号？去登录
                        </button>
                    </div>
                </section>
            </section>
        </section>
    </main>

    <script>
        window.APP_CONFIG = {
            heroImages: {{ hero_images | default([], true) | tojson }},
        };
    </script>
    <script src="/static/app.js?v=20260616-recommendation-clean-v1"></script>
</body>
</html>
